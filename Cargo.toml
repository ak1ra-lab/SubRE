[package]
name = "subtitle-renamer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Batch-rename external subtitle files to match paired video filenames"
repository = "https://git.ak1ra.xyz/ak1ra-lab/subtitle-renamer"
keywords = ["subtitle", "video", "rename", "egui", "desktop"]
categories = ["command-line-utilities", "multimedia"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Low-signal pedantic lints allowed at package level; flag these on a case-by-case basis in source.
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
ignored_unit_patterns = "allow"
# Cargo metadata / transitive deps — not actionable in this repo.
multiple_crate_versions = "allow"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
regex = "1.13.1"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.4"
unicode-normalization = "0.1.25"
